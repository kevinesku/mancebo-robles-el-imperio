name: Publish existing v0.1.0 packages

on:
  push:
    tags:
      - v0.1.0
    branches:
      - main
    paths:
      - .github/workflows/release-existing-packages.yml
      - tools/publish_existing_release.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-existing-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the existing game and ZIP packages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify, upload, download-check and publish the existing files
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kevinesku/mancebo-robles-el-imperio
        run: |
          set +e
          bash tools/publish_existing_release.sh 2>&1 | tee /tmp/mancebo-release.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record publication status for recovery and diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('/tmp/mancebo-release.log')
          body = path.read_text() if path.exists() else 'No publication output available.'
          token = os.environ.get('GH_TOKEN', '')
          if token:
              body = body.replace(token, '[REDACTED]')
          body = re.sub(r'https://[^\s]+[?][^\s]+', '[URL query redacted]', body)
          body = body.replace('```', "'''")
          report = '# v0.1.0 publication status\n\n'
          report += 'Run: ' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\n'
          report += 'Exit code: ' + os.environ.get('RELEASE_EXIT_CODE', 'unknown') + '\n\n```text\n' + body[-24000:] + '\n```\n'
          Path('/tmp/RELEASE_PUBLICATION_STATUS.md').write_text(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/release-publication-status; then
            git checkout --track origin/release-publication-status
          else
            git checkout -b release-publication-status
          fi
          cp /tmp/RELEASE_PUBLICATION_STATUS.md RELEASE_PUBLICATION_STATUS.md
          git add RELEASE_PUBLICATION_STATUS.md
          git commit -m "Record v0.1.0 release publication result" || test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/release-publication-status
      - name: Require a successful publication
        if: always()
        env:
          RELEASE_EXIT_CODE: ${{ steps.release.outputs.exit_code }}
        run: test "$RELEASE_EXIT_CODE" = 0
