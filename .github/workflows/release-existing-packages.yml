name: Publish existing v0.1.0 packages

on:
  push:
    tags:
      - v0.1.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-existing-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the existing game and ZIP packages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify, upload, download-check and publish the existing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kevinesku/mancebo-robles-el-imperio
        run: bash tools/publish_existing_release.sh
